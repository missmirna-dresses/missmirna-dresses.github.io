<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#5a2a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميس ميرنا">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ميس ميرنا</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;-webkit-text-size-adjust:100%;font-family:Tahoma,Arial,sans-serif;font-size:19px;background:#faf5f3;color:#2b2326;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{background:#5a2a3c;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:21px}
.btn{font-family:inherit;font-size:20px;border:0;border-radius:12px;padding:14px 18px;background:#5a2a3c;color:#fff;width:100%;margin:6px 0}
.btn.g{background:#2e7d4f}.btn.y{background:#d4a24c;color:#2b1a05}.btn.w{background:#e9dde1;color:#3a1524}.btn.r{background:#b3261e}
input,select,textarea{font-family:inherit;font-size:20px;padding:12px;border:2px solid #d9c6cd;border-radius:10px;width:100%;background:#fff}
label{display:block;font-size:16px;color:#6b4a57;margin:10px 0 3px}
.wrap{padding:12px 14px}
.dc{display:flex;gap:12px;background:#fff;border-radius:12px;box-shadow:0 1px 4px #0002;margin:10px 0;padding:8px;align-items:center}
.dc img,.dc .ph{width:84px;height:110px;object-fit:cover;border-radius:8px;background:#f0e4e8;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#a88}
.mut{color:#8a6f7a;font-size:15px}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0003;display:flex;gap:10px}
.bar .btn{margin:0}
.msg{background:#eaf6ee;border-right:6px solid #2e7d4f;padding:10px 12px;border-radius:8px;margin:10px 0}
.warn{background:#fff3cd;border-right:6px solid #d4a24c;padding:10px 12px;border-radius:8px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev img{max-width:100%;max-height:320px;border-radius:10px;margin-top:8px}

.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cc{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0002;break-inside:avoid}
.cc .im{height:200px;background:#f0e4e8;display:flex;align-items:center;justify-content:center;color:#a88;font-size:14px}
.cc img{width:100%;height:100%;object-fit:cover}
.cc .tx{padding:8px 10px;font-size:15px;line-height:1.5}.cc .tx b{font-size:19px}
@media print{header,.bar,.noprint{display:none!important}body{background:#fff;padding:0;font-size:12px}.cg{grid-template-columns:repeat(3,1fr);gap:4mm}.cc{box-shadow:none;border:1px solid #444;height:84mm}.cc .im{height:54mm}.cc .tx{font-size:12px}.cc .tx b{font-size:17px}@page{size:A4;margin:8mm}}
</style>
</head>
<body>
<header><b>ميس ميرنا</b><span id="cnt"></span></header>
<div id="v"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const BASE=['باربي','مرميت','تواوك','جوميه'];
let db,D=[],meta={lastExport:null,next:1},cur=null,photo=null,q='';
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('miss-mirna-mobile',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const get=k=>new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)});
const put=(k,v)=>new Promise((r,j)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)});
const persist=async()=>{await put('dresses',D);await put('meta',meta)};
async function boot(){
  db=await open();D=(await get('dresses'))||[];meta=(await get('meta'))||meta;
  try{const h=location.hash;if(h.startsWith('#link=')){const c=h.slice(6);history.replaceState(null,'',location.pathname);if(c.startsWith('MM1:')){const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));if(o.u&&o.t&&/^https:\/\/script\.google\.com\//.test(o.u)){meta.sync={u:o.u,t:o.t};await put('meta',meta);window._linked=1}}}}catch(e){}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!meta.dev){meta.dev='ph-'+uid();await persist()}
  if(!meta.name)return askName();
  if(window._linked){window._linked=0;alert('تم ربط المزامنة');bk();return}
  if(meta.home==='store'||location.hash==='#store')return store();
  list();
}
const types=x=>{const L=BASE.concat((meta.types||[]).filter(t=>!BASE.includes(t)));return x&&!L.includes(x)?L.concat([x]):L};
function typePicked(el){if(el.value!=='__new')return;const t=(prompt('اكتب نوع الفستان الجديد')||'').trim();if(t){meta.types=meta.types||[];if(!types().includes(t))meta.types.push(t);const o=document.createElement('option');o.textContent=t;el.insertBefore(o,el.lastElementChild);el.value=t}else el.value=''}
const code=n=>'D-'+String(n).padStart(3,'0');
const lbl=d=>d.code?d.code:(d.loc?'م-'+d.loc:'جديد');
function askName(){
  $('#v').innerHTML=`<div class="wrap"><h3>اسمك إيه؟</h3><div class="mut">بنسجله مرة واحدة بس، عشان صاحب المحل يعرف مين سجّل الفساتين دي.</div>
  <label>الاسم</label><input id="nm" placeholder="مثال: منى"><button class="btn g" onclick="saveName()">حفظ</button></div>`;
}
async function saveName(){const n=($('#nm').value||'').trim();if(!n)return alert('اكتب اسمك الأول');meta.name=n;meta.asked=true;await persist();list()}
async function skipName(){meta.asked=true;await persist();list()}
function list(){window._scr='list';
  bkAuto=0;cur=null;photo=null;$('#cnt').textContent=D.length+' فستان';
  const L=D.filter(d=>!q||(lbl(d)+' '+d.old+' '+d.desc+' '+d.color+' '+(d.type||'')).includes(q));
  const un=D.filter(d=>!meta.lastExport||(d.mod||'')>meta.lastExport).length;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  $('#v').innerHTML=`<div class="wrap">
  ${ios&&!sa?'<div class="warn">مهم: قبل ما تسجل أي فستان اضغط زرار المشاركة (المربع والسهم) ثم "إضافة إلى الشاشة الرئيسية"، وافتح التطبيق من الأيقونة. اللي بيتسجل في سفاري مش بيظهر في الأيقونة.</div>':''}
  <input id="q" placeholder="بحث بالكود أو الوصف أو النوع أو اللون" value="${esc(q)}" oninput="q=this.value;list2()">
  ${un?`<div class="warn">${un} فستان لسه ما اتبعتوش للكمبيوتر</div>`:(D.length?'<div class="msg">كل الفساتين اتبعتت ✔</div>':'')}
  <div id="L">${L.map(row).join('')||'<div class="mut" style="margin:20px 0">لسه مفيش فساتين. اضغط "+ فستان جديد".</div>'}</div></div>
  <div class="bar"><button class="btn y" onclick="edit(null)">+ فستان جديد</button><button class="btn g" onclick="exportFile()">إرسال للكمبيوتر</button></div>
  <div class="wrap"><button class="btn" onclick="store()">🏬 شاشة المخزن</button><button class="btn y" onclick="bk()">🔍 الحجوزات والعملاء</button><button class="btn y" onclick="cat()">📖 كتالوج الفساتين</button><button class="btn w" onclick="more()">نسخة احتياطية / استرجاع</button></div>`;
}


/* ===== شاشة المخزن (قراءة فقط، من غير أسعار) ===== */
let stF='out',stM=null,stD=null;
const addD=(x,n)=>{const d=new Date(x+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function stData(){const pc=meta.pc;if(!pc)return null;const ds={};pc.dresses.forEach(d=>ds[d.id]=d);
  const act=pc.bookings.filter(b=>b.st==='out'||b.st==='booked');
  const dbl=[];pc.dresses.forEach(d=>{if((d.qty||1)>1)return;const L=act.filter(b=>b.dressId===d.id).sort((a,b)=>a.out<b.out?-1:1);
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const A=L[i],B=L[j];if(A.out<=B.ret&&B.out<=A.ret){dbl.push([d,A,B]);}}});
  return {pc,ds,act,dbl,late:act.filter(b=>b.late>0),sold:pc.dresses.filter(d=>d.st==='sold')}}
const stCard=(d,tag,col,extra)=>`<div class="dc">${d&&d.photo?`<img src="${d.photo}">`:'<div class="ph">بدون صورة</div>'}<div><b>${esc(d?d.id:'')}</b> ${tag?`<span style="background:${col};color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:bold">${tag}</span>`:''}<div>${esc(d?[d.desc,d.type,d.color].filter(Boolean).join(' - '):'')}</div>${extra||''}</div></div>`;
function stPrep(b,act,ds){const d=ds[b.dressId]||{};if((d.qty||1)>1)return '<div class="mut">فيه أكتر من قطعة، راجع الجرد</div>';
  const pv=act.filter(x=>x!==b&&x.dressId===b.dressId&&(x.st==='out'||x.out<b.out)&&x.ret<=b.ret).sort((x,y)=>x.ret<y.ret?1:-1)[0];
  if(!pv)return '<div style="background:#eaf6ee;border-radius:8px;padding:4px 8px;margin-top:4px">✔ جوه المحل، جهّزه</div>';
  const gap=Math.round((new Date(b.out+'T12:00:00')-new Date(pv.ret+'T12:00:00'))/864e5);
  return `<div style="background:#fff3cd;border-radius:8px;padding:4px 8px;margin-top:4px"><b>خد بالك:</b> الفستان لسه ${pv.st==='out'?'عند':'محجوز لـ'} ${esc(pv.name)}، راجع ${fd(pv.ret)} وخارج ${fd(b.out)}${gap<0?' - <b>الحجزين متداخلين</b>':gap<=1?' - <b>الفرق '+(gap===0?'نفس اليوم':'يوم واحد')+'</b>':''}${pv.late>0?' - <b>وهي متأخرة '+pv.late+' يوم</b>':''}</div>`}
function store(){window._scr='store';
  if(meta.sync&&!bkAuto){bkAuto=1;bkSync(false)}
  const X=stData();
  if(!X){$('#v').innerHTML=`<div class="wrap"><h3>🏬 شاشة المخزن</h3><div class="mut">لسه مفيش بيانات من المحل. اربط الكود أو اطلب الملف من 🔍 الحجوزات والعملاء.</div><button class="btn w" onclick="list()">رجوع</button></div>`;return}
  const {pc,ds,act,dbl,late,sold}=X,t=today(),w=addD(t,7);
  const at=pc.at?new Date(pc.at):null,age=at?Math.floor((Date.now()-at)/864e5):0;
  const al=[];
  dbl.forEach(([d,A,B])=>al.push(['#b3261e','⚠ محجوز مرتين وفيه قطعة واحدة',`<b>${esc(d.id)}</b> - ${esc(A.name)} (${fd(A.out)} إلى ${fd(A.ret)}) و ${esc(B.name)} (${fd(B.out)} إلى ${fd(B.ret)})`]));
  late.forEach(b=>al.push(['#c0392b','⏰ متأخر '+b.late+' يوم',`<b>${esc(b.dressId)}</b> عند ${esc(b.name)}، كان لازم يرجع ${fd(b.ret)}`]));
  sold.forEach(d=>al.push(['#555','🏷 اتباع',`<b>${esc(d.id)}</b> - ${esc([d.desc,d.type].filter(Boolean).join(' - '))}، اتشال من الإيجار`]));
  const tOut=act.filter(b=>b.st==='booked'&&b.out===t),tRet=act.filter(b=>b.st==='out'&&b.ret===t);
  tOut.forEach(b=>al.push(['#d4a24c','📤 خروج النهارده',`<b>${esc(b.dressId)}</b> - ${esc(b.name)}`]));
  tRet.forEach(b=>al.push(['#2d7d4f','📥 راجع النهارده',`<b>${esc(b.dressId)}</b> - ${esc(b.name)}`]));
  const btn=(k,l)=>`<button class="btn ${stF===k?'':'w'}" style="flex:1;padding:12px 2px;font-size:17px" onclick="stF='${k}';store()">${l}</button>`;
  let body='';
  if(stF==='out'){
    const L=act.filter(b=>b.st==='out'||b.out<=w).sort((a,b)=>a.out<b.out?-1:1);
    body=`<h3>الخروج (من النهارده لـ 7 أيام + اللي بره)</h3>`+(L.map(b=>stCard(ds[b.dressId]||{id:b.dressId},b.st==='out'?'بره':'خروج '+fd(b.out),b.st==='out'?'#c0392b':'#d4a24c',`<div>${esc(b.name)}</div><div class="mut">يرجع ${fd(b.ret)}${b.late>0?' - متأخر '+b.late+' يوم':''}</div>${b.st==='booked'?stPrep(b,act,ds):''}`)).join('')||'<div class="mut">مفيش خروج قريب</div>')}
  else if(stF==='inv'){
    const outN={};act.filter(b=>b.st==='out').forEach(b=>outN[b.dressId]=(outN[b.dressId]||0)+1);
    const exp=pc.dresses.filter(d=>d.st!=='sold').map(d=>[d,(d.qty||1)-(outN[d.id]||0)]).filter(x=>x[1]>0);
    const tot=exp.reduce((a,x)=>a+x[1],0),o=Object.values(outN).reduce((a,b)=>a+b,0);
    body=`<h3>الجرد (من أرقام السيستم)</h3><div class="two"><div class="msg" style="margin:4px 0"><b style="font-size:28px">${tot}</b><br>المفروض جوه المحل</div><div class="warn" style="margin:4px 0"><b style="font-size:28px">${o}</b><br>بره عند عميلات</div></div><div class="mut">اتحسبت من آخر نسخة. قارنها بالعد الفعلي. المباع (${sold.length}) مش محسوب.</div>`+exp.map(([d,n])=>stCard(d,n>1?n+' قطع':'',"#2d7d4f")).join('')}
  else if(stF==='cal'){
    const base=stM||t.slice(0,7),[Y,M]=base.split('-').map(Number),first=new Date(Y,M-1,1),dim=new Date(Y,M,0).getDate(),off=(first.getDay()+1)%7;
    const ev={};act.forEach(b=>{(ev[b.out]=ev[b.out]||{o:0,r:0}).o++;(ev[b.ret]=ev[b.ret]||{o:0,r:0}).r++});
    let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
    for(let d=1;d<=dim;d++){const k=base+'-'+String(d).padStart(2,'0'),e=ev[k];cells+=`<div onclick="stD='${k}';store()" style="background:${stD===k?'#f2d7e0':'#fff'};border-radius:8px;padding:4px 0;text-align:center;min-height:52px;${k===t?'outline:2px solid #5a2a3c':''}"><div>${d}</div>${e?`<div style="font-size:12px;line-height:1.2">${e.o?'<span style="color:#b8860b">↑'+e.o+'</span> ':''}${e.r?'<span style="color:#2d7d4f">↓'+e.r+'</span>':''}</div>`:''}</div>`}
    const pm=(Y,M-2)>=0?new Date(Y,M-2,1):new Date(Y-1,11,1);const nm=new Date(Y,M,1);const ym=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
    const sel=stD&&stD.startsWith(base)?act.filter(b=>b.out===stD||b.ret===stD):[];
    body=`<h3>التقويم</h3><div style="display:flex;gap:8px;align-items:center"><button class="btn w" style="flex:1" onclick="stM='${ym(pm)}';stD=null;store()">›</button><b style="flex:3;text-align:center">${first.toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}</b><button class="btn w" style="flex:1" onclick="stM='${ym(nm)}';stD=null;store()">‹</button></div><div class="mut">↑ خروج &nbsp; ↓ رجوع</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0" dir="rtl">${['س','ح','ن','ث','ر','خ','ج'].map(x=>`<div class="mut" style="text-align:center">${x}</div>`).join('')}${cells}</div>`+(stD?`<b>${fd(stD)}</b>`+(sel.map(b=>stCard(ds[b.dressId]||{id:b.dressId},b.out===stD?'خروج':'رجوع',b.out===stD?'#d4a24c':'#2d7d4f',`<div>${esc(b.name)}</div>`)).join('')||'<div class="mut">مفيش حاجة اليوم ده</div>'):'<div class="mut">اضغط على يوم عشان تشوف تفاصيله</div>')}
  else{
    const L=pc.dresses.slice().sort((a,b)=>(b.n||0)-(a.n||0));const has=pc.dresses.some(d=>d.n!=null);
    body=`<h3>عدد مرات خروج كل فستان</h3>`+(has?'':'<div class="warn">الملف ده قديم ومفيهوش العدد. حدّث من الكمبيوتر.</div>')+L.map(d=>stCard(d,'',"",`<div style="font-size:22px"><b>${d.n==null?'-':d.n}</b> <span class="mut">مرة خرج</span></div>`)).join('')}
  $('#v').innerHTML=`<div class="wrap"><div class="mut">${esc(bkMsg)}</div>
  <h3 style="margin:4px 0">🔔 تنبيهات (${al.length})</h3>${al.slice(0,stAll?99:3).map(a=>`<div style="background:#fff;border-right:6px solid ${a[0]};padding:8px 10px;border-radius:8px;margin:6px 0"><b>${a[1]}</b><div>${a[2]}</div></div>`).join('')||'<div class="msg">مفيش تنبيهات ✔</div>'}${al.length>3&&!stAll?`<button class="btn w" onclick="stAll=1;store()">كل التنبيهات (${al.length})</button>`:''}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0">${btn('out','📤 الخروج')}${btn('inv','📋 الجرد')}${btn('cal','📅 التقويم')}${btn('cnt','🔢 عدد الخروج')}</div>
  ${body}
  <div class="mut" style="margin-top:12px">آخر تحديث من المحل: ${at?at.toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):''}${age>=1?' <b style="color:#c0392b">(من '+age+' يوم)</b>':''}</div>
  ${meta.sync?`<button class="btn g" onclick="bkAuto=0;store()">🔄 تحديث</button>`:'<div class="mut">مفيش ربط. اربط من 🔍 الحجوزات والعملاء.</div>'}
  <label style="display:flex;gap:8px;align-items:center;font-size:16px"><input type="checkbox" style="width:24px;height:24px" ${meta.home==='store'?'checked':''} onchange="meta.home=this.checked?'store':'';persist()">افتح على شاشة المخزن دايمًا</label>
  <button class="btn w" onclick="list()">رجوع للفساتين</button></div>`;
}
let stAll=0;

/* ===== الحجوزات والعملاء (من الكمبيوتر، قراءة فقط) ===== */
let bkF='out',bkQ='',bkAuto=0,bkMsg='';
const fd=x=>x?String(x).split('-').reverse().slice(0,2).join('/'):'';
async function bkSync(manual){
  const y=meta.sync;if(!y)return;bkMsg='...جاري التحديث';if(manual)bk();
  try{const r=await fetch(y.u+(y.u.includes('?')?'&':'?')+'t='+encodeURIComponent(y.t));const j=await r.json();
    if(!j.ok)throw new Error(j.error==='token'?'كود الربط قديم، اربط من جديد':j.error==='empty'?'لسه الكمبيوتر ماسجلش بيانات':'رد غير متوقع');
    meta.pc=j.data;meta.syncAt=Date.now();await persist();bkMsg=''}
  catch(e){bkMsg='⚠ ما قدرناش نحدث ('+((e&&e.message&&!/fetch|Network|Load/i.test(e.message))?e.message:'مفيش إنترنت')+'). معروض آخر نسخة محفوظة.'}
  if(window._scr==='store')store();else bk()}
async function bkLink(code){code=(code||'').trim();if(code.includes('#link='))code=code.split('#link=')[1];
  if(!code.startsWith('MM1:'))return alert('الكود مش صحيح');
  try{const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));if(!o.u||!o.t||!/^https:\/\/script\.google\.com\//.test(o.u))throw 1;meta.sync={u:o.u,t:o.t};await persist();bkAuto=1;bkSync(true)}catch(e){alert('الكود مش صحيح')}}
async function bkUnlink(){if(!confirm('فصل الربط؟ هتفضل آخر نسخة محفوظة.'))return;delete meta.sync;await persist();bk()}
function bkLinkBox(){return meta.sync?`<button class="btn g" onclick="bkSync(true)">🔄 تحديث الآن</button>`:`<div class="mut" style="margin-top:8px">لو المحل بعتلك كود ربط، الصقه هنا عشان التحديث يبقى تلقائي:</div><input id="lk" placeholder="MM1:..." style="direction:ltr"><button class="btn y" onclick="bkLink($('#lk').value)">ربط</button>`}
function bk(){window._scr='bk';
  if(meta.sync&&!bkAuto){bkAuto=1;bkSync(false)}
  const pc=meta.pc;
  if(!pc){$('#v').innerHTML=`<div class="wrap"><h3>الحجوزات والعملاء</h3><div class="mut">لسه مفيش بيانات من الكمبيوتر. اربط بكود المزامنة، أو اطلب ملف الحجوزات على واتساب واختاره.</div><div class="mut">${esc(bkMsg)}</div>${bkLinkBox()}
  <input type="file" id="pcf" accept=".txt,.json,text/plain,application/json" hidden onchange="bkLoad(this)"><button class="btn g" onclick="$('#pcf').click()">📥 تحديث من الكمبيوتر (ملف)</button><button class="btn w" onclick="list()">رجوع</button></div>`;return}
  const ds={};pc.dresses.forEach(d=>ds[d.id]=d);
  const inn=pc.dresses.filter(d=>d.st==='in'),out=pc.bookings.filter(b=>b.st==='out').sort((a,b)=>a.ret<b.ret?-1:1),bkd=pc.bookings.filter(b=>b.st==='booked').sort((a,b)=>a.out<b.out?-1:1);
  const m=(t,x)=>!bkQ||t.includes(bkQ);
  const dtxt=d=>d?[d.id,d.old,d.desc,d.type,d.color].join(' '):'';
  const btxt=b=>[b.name,b.phone,b.dressId,b.id,dtxt(ds[b.dressId])].join(' ');
  const fb=(b,tag,col)=>{const d=ds[b.dressId]||{};return `<div class="dc">${d.photo?`<img src="${d.photo}">`:'<div class="ph">بدون صورة</div>'}<div><b>${esc(b.dressId)}</b> <span style="background:${col};color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:bold">${tag}${b.late?' - متأخر '+b.late+' يوم':''}</span><div>${esc([d.desc,d.type,d.color].filter(Boolean).join(' - '))}</div><div><b>${esc(b.name)}</b></div>${b.phone?`<div><a href="tel:${esc(b.phone)}">📞 ${esc(b.phone)}</a></div>`:''}<div class="mut">${b.st==='out'?'خروج':'هتخرج'}: ${fd(b.out)} · ${b.st==='out'?'رجوع':'هترجع'}: ${fd(b.ret)}</div><div class="mut">حجز ${esc(b.id)}${b.rem?' · باقي: '+b.rem:''}</div></div></div>`};
  const fi=d=>{const nx=bkd.find(b=>b.dressId===d.id);return `<div class="dc">${d.photo?`<img src="${d.photo}">`:'<div class="ph">بدون صورة</div>'}<div><b>${esc(d.id)}</b> <span style="background:#2d7d4f;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:bold">جوه المحل</span><div>${esc([d.desc,d.type,d.color].filter(Boolean).join(' - '))}</div>${nx?`<div class="mut">محجوز جاي: ${esc(nx.name)} من ${fd(nx.out)}</div>`:''}</div></div>`};
  let rows;
  if(bkQ){rows=out.filter(b=>m(btxt(b))).map(b=>fb(b,'بره','#c0392b')).concat(bkd.filter(b=>m(btxt(b))).map(b=>fb(b,'محجوز','#d4a24c'))).concat(inn.filter(d=>m(dtxt(d))).map(fi))}
  else rows=bkF==='in'?inn.map(fi):bkF==='out'?out.map(b=>fb(b,'بره','#c0392b')):bkd.map(b=>fb(b,'محجوز','#d4a24c'));
  const at=pc.at?new Date(pc.at):null,age=at?Math.floor((Date.now()-at)/864e5):0;
  const bt=(k,l,n,c,tc)=>`<button class="btn" style="background:${c};color:${tc||'#fff'};padding:12px 2px;flex:1;${!bkQ&&bkF===k?'outline:3px solid #333':''}" onclick="bkF='${k}';bkQ='';bk()">${l}<br>${n}</button>`;
  $('#v').innerHTML=`<div class="wrap"><input id="bq" placeholder="بحث: اسم أو تليفون أو موديل" value="${esc(bkQ)}" oninput="bkQ=this.value;bk2()">
  <div style="display:flex;gap:6px;margin:8px 0">${bt('in','جوه المحل',inn.length,'#2d7d4f')}${bt('out','بره عند العميلة',out.length,'#c0392b')}${bt('booked','محجوز جاي',bkd.length,'#d4a24c','#000')}</div>
  <div class="mut">${esc(bkMsg)}</div><div class="mut">آخر نسخة من الكمبيوتر: ${at?at.toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):''}${age>=1?' <b style="color:#c0392b">(من '+age+' يوم، اطلب ملف جديد)</b>':''}</div>
  <div id="L">${rows.join('')||'<div class="mut" style="margin:20px 0">مفيش نتائج</div>'}</div>
  <div class="mut" style="background:#fff3cd;padding:8px;border-radius:8px">البيانات للقراءة فقط، من آخر ملف اتبعت من الكمبيوتر.</div>
  <input type="file" id="pcf" accept=".txt,.json,text/plain,application/json" hidden onchange="bkLoad(this)">${bkLinkBox()}<button class="btn w" onclick="$('#pcf').click()">📥 تحديث من ملف واتساب</button>${meta.sync?'<button class="btn w" onclick="bkUnlink()">فصل الربط</button>':''}<button class="btn w" onclick="list()">رجوع</button></div>`;
}
function bk2(){const v=bkQ;bk();const i=$('#bq');i.focus();i.setSelectionRange(v.length,v.length)}
async function bkLoad(inp){const f=inp.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return alert('الملف مش صالح')}
  if(!d||d.app!=='miss-mirna-bookings'||!Array.isArray(d.bookings)||!Array.isArray(d.dresses))return alert('ده مش ملف الحجوزات من الكمبيوتر');
  meta.pc=d;await persist();bk()}
function list2(){const v=q;list();const i=$('#q');i.focus();i.setSelectionRange(v.length,v.length)}
const row=d=>`<div class="dc" onclick="edit('${d.uid}')">${d.photo?`<img src="${d.photo}">`:'<div class="ph">بدون صورة</div>'}<div><b>${esc(lbl(d))}</b>${d.code?'':' <span class="mut">(الكود هيتحدد في الكمبيوتر)</span>'}${d.old?` <span class="mut">(قديم: ${esc(d.old)})</span>`:''}<div>${esc(d.desc)}</div>${d.by?`<div class="mut">سجّله: ${esc(d.by)}</div>`:''}${d.type?`<div><b style="color:#7a3d55">${esc(d.type)}</b></div>`:''}<div class="mut">${esc(d.color)}${(d.qty||1)>1?' · عدد القطع '+esc(d.qty):''}</div></div></div>`;
function edit(id){
  cur=id?D.find(d=>d.uid===id):{uid:uid(),code:'',loc:(meta.loc=(meta.loc||0)+1),old:'',desc:'',type:'',color:'',rent:'',sale:'',notes:'',photo:''};
  photo=cur.photo||'';
  $('#v').innerHTML=`<div class="wrap">
  <div class="two"><div><label>الكود الجديد</label><input id="c" value="${esc(cur.code||'هيتحدد في الكمبيوتر')}" disabled></div><div><label>الكود القديم</label><input id="o" value="${esc(cur.old)}"></div></div>
  <label>الوصف / الموديل</label><input id="d" value="${esc(cur.desc)}">
 <label>نوع الفستان</label><select id="t" onchange="typePicked(this)"><option value="">-- اختر --</option>${types(cur.type).map(t=>`<option ${t===cur.type?'selected':''}>${esc(t)}</option>`).join('')}<option value="__new">+ إضافة نوع جديد...</option></select>
  <label>اللون</label><input id="l" value="${esc(cur.color)}">
  <label>عدد القطع</label><input id="q2" type="number" inputmode="numeric" min="1" value="${esc(cur.qty||1)}">
  <label>ملاحظات</label><input id="n" value="${esc(cur.notes)}">
  <label>الصورة</label>
  <div class="two"><button class="btn" onclick="$('#cam').click()">📷 كاميرا</button><button class="btn w" onclick="$('#gal').click()">🖼 من الصور</button></div>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="pick(this)">
  <input type="file" id="gal" accept="image/*" hidden onchange="pick(this)">
  <div class="prev" id="pv">${photo?`<img src="${photo}">`:''}</div>
  <button class="btn g" onclick="saveD(false)">حفظ</button>
  <button class="btn y" onclick="saveD(true)">حفظ وفستان تاني</button>
  <button class="btn w" onclick="list()">رجوع</button>
  ${id?`<button class="btn r" onclick="delD()">حذف الفستان</button>`:''}</div>`;
  window.scrollTo(0,0);
}
function pick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=800,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',0.72);$('#pv').innerHTML=`<img src="${photo}">`};im.src=r.result};r.readAsDataURL(f)}
async function saveD(again){
  const g=i=>$('#'+i).value.trim();
  cur.old=g('o');cur.desc=g('d');cur.color=g('l');cur.type=$('#t').value==='__new'?'':$('#t').value;cur.notes=g('n');cur.qty=Math.max(1,parseInt(g('q2'))||1);cur.photo=photo||'';cur.mod=new Date().toISOString();if(!cur.by)cur.by=meta.name||'';
  if(!cur.old&&!cur.desc&&!cur.photo)return alert('اكتب وصف الفستان أو الكود القديم أو صوّره');
  if(!D.some(d=>d.uid===cur.uid))D.unshift(cur);
  await persist();if(again)edit(null);else list();
}
async function delD(){if(!confirm('حذف الفستان؟'))return;D=D.filter(d=>d.uid!==cur.uid);await persist();list()}
function build(){return {app:'dokkan-elfarah-mobile',v:1,at:new Date().toISOString(),dev:{id:meta.dev,name:meta.name||''},types:types(),dresses:D.map(d=>({uid:d.uid,mod:d.mod||'',loc:d.loc||'',code:d.code||'',qty:d.qty||1,old:d.old,desc:d.desc,type:d.type||'',color:d.color,rent:d.rent,sale:d.sale,notes:d.notes,by:d.by||'',photo:d.photo}))}}
async function exportFile(){
  if(!D.length)return alert('مفيش فساتين تتبعت');
  const name='فساتين-'+(meta.name?meta.name+'-':'')+today()+'.txt';
  const file=new File([JSON.stringify(build())],name,{type:'text/plain'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'فساتين ميس ميرنا'});meta.lastExport=new Date().toISOString();await persist();return list()}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  meta.lastExport=new Date().toISOString();await persist();alert('الملف اتحفظ في الملفات / التنزيلات. ابعته على واتساب للكمبيوتر.');list();
}
let cq='',ct='';
const cardH=d=>`<div class="cc"><div class="im">${d.photo?`<img src="${d.photo}">`:'بدون صورة'}</div><div class="tx"><b>${esc(lbl(d))}</b>${d.old?`<div>قديم: ${esc(d.old)}</div>`:''}<div>${esc(d.type||'-')} · ${esc(d.color||'-')}</div>${d.desc?`<div class="mut">${esc(d.desc)}</div>`:''}</div></div>`;
const cList=()=>D.filter(d=>(!ct||d.type===ct)&&(!cq||(lbl(d)+' '+d.old+' '+d.desc+' '+d.color+' '+(d.type||'')).includes(cq)));
function cat(){
  const L=cList();
  $('#v').innerHTML=`<div class="wrap"><div class="noprint"><input id="cq" placeholder="بحث" value="${esc(cq)}" oninput="cq=this.value;cat2()">
  <label>النوع</label><select id="ct" onchange="ct=this.value;cat()"><option value="">كل الأنواع</option>${types().map(t=>`<option ${t===ct?'selected':''}>${esc(t)}</option>`).join('')}</select>
  <div class="mut" style="margin-top:6px">${L.length} فستان</div>
  <button class="btn g" onclick="catImg()">📤 مشاركة كصور</button>
  <button class="btn" onclick="window.print()">🖨 حفظ PDF / طباعة</button>
  <div class="mut">للـ PDF على الايفون: بعد ما تضغط الزرار، اضغط مشاركة ثم "حفظ في الملفات" (أو افتح معاينة الطباعة بإصبعين وشارك).</div>
  <button class="btn w" onclick="list()">رجوع</button></div>
  <h3 style="text-align:center;margin:10px 0 0" class="pt">ميس ميرنا - كتالوج الفساتين</h3>
  <div class="cg">${L.map(cardH).join('')}</div></div>`;
  window.scrollTo(0,0);
}
function cat2(){const v=cq;cat();const i=$('#cq');i.focus();i.setSelectionRange(v.length,v.length)}
const loadImg=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
async function catImg(){
  const L=cList();if(!L.length)return alert('مفيش فساتين');
  const files=[],W=1200,H=1700,pad=30,cw=(W-pad*3)/2,ch=(H-150-pad*4)/3;
  for(let p=0;p*6<L.length;p++){
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    x.fillStyle='#faf5f3';x.fillRect(0,0,W,H);x.direction='rtl';x.textAlign='center';x.fillStyle='#5a2a3c';x.font='bold 48px Tahoma,Arial,sans-serif';x.fillText('ميس ميرنا - كتالوج الفساتين',W/2,80);
    const part=L.slice(p*6,p*6+6);
    for(let i=0;i<part.length;i++){
      const d=part[i],col=i%2,row=Math.floor(i/2),cx=W-pad-cw-col*(cw+pad),cy=130+pad+row*(ch+pad);
      x.fillStyle='#fff';x.fillRect(cx,cy,cw,ch);x.strokeStyle='#bbb';x.strokeRect(cx,cy,cw,ch);
      const ih=ch-170;x.fillStyle='#f0e4e8';x.fillRect(cx,cy,cw,ih);
      const im=await loadImg(d.photo);
      if(im){const k=Math.max(cw/im.width,ih/im.height),sw=cw/k,sh=ih/k;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,cx,cy,cw,ih)}
      else{x.fillStyle='#a88';x.font='26px Tahoma,Arial,sans-serif';x.textAlign='center';x.fillText('بدون صورة',cx+cw/2,cy+ih/2)}
      x.textAlign='right';x.fillStyle='#000';x.font='bold 40px Tahoma,Arial,sans-serif';x.fillText(lbl(d),cx+cw-16,cy+ih+46);
      x.font='28px Tahoma,Arial,sans-serif';x.fillStyle='#333';
      x.fillText((d.old?'قديم: '+d.old+' · ':'')+(d.type||'-'),cx+cw-16,cy+ih+88);
      x.fillText('اللون: '+(d.color||'-'),cx+cw-16,cy+ih+126);
    }
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    files.push(new File([blob],'كتالوج-'+(p+1)+'.png',{type:'image/png'}));
  }
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:'كتالوج فساتين ميس ميرنا'});return}}catch(e){if(e&&e.name==='AbortError')return}
  for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
  alert('الصور اتحفظت في التنزيلات / الملفات.');
}
function more(){
  $('#v').innerHTML=`<div class="wrap"><h3>نسخة احتياطية</h3><div class="mut">الفساتين محفوظة على التليفون ده بس. "إرسال للكمبيوتر" بيعمل ملف تقدر تحتفظ بيه كنسخة احتياطية كمان.</div>
  <button class="btn g" onclick="exportFile()">حفظ / إرسال ملف</button>
  <h3>استرجاع من ملف</h3><input type="file" accept=".json,.txt,text/plain,application/json" onchange="restore(this.files[0])"><div id="rs"></div>
  <button class="btn w" onclick="list()" style="margin-top:20px">رجوع</button></div>`;
}
async function restore(f){
  if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='dokkan-elfarah-mobile')throw 0;
    (d.types||[]).forEach(t=>{meta.types=meta.types||[];if(!types().includes(t))meta.types.push(t)});let a=0;for(const x of d.dresses||[]){const i=D.findIndex(y=>y.uid===x.uid);if(i>=0){const un=!meta.lastExport||(D[i].mod||'')>meta.lastExport;if(un){if(x.code)D[i].code=x.code}else Object.assign(D[i],x)}else{D.push(Object.assign({mod:''},x));a++}}
    await persist();$('#rs').innerHTML=`<div class="msg">تم. ${d.dresses.length} فستان (${a} جديد).</div>`}catch(e){$('#rs').innerHTML='<div class="warn">الملف مش صحيح</div>'}
}
boot();
</script>
